<h2>Gestión de Empleados</h2>

<!--ALERTA-->
<div id="alertBox" class="alert-box hidden"></div>

<button id="addEmployeeBtn" class="btn-primary">Agregar empleado</button>

<table class="table">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Activo</th>
            <th>Estado laboral</th>
        </tr>
    </thead>
    <tbody>
        {% for e in empleados %}
        <tr>
            <td>{{ e.nombre }}</td>
            <td>{{ e.username }}</td>
            <td>{{ e.rol }}</td>

            <!--CAMBIAR activo/inactivo-->
            <td>
                <button 
                    class="toggle-btn {{ e.activo|yesno:'activo,inactivo' }}" 
                    data-id="{{ e.id }}">
                    {{ e.activo|yesno:"Sí,No" }}
                </button>
            </td>

            <!-- ESTADO LABORAL CON BOTÓN + DROPDOWN -->
            <td>
              <div class="estado-dropdown" data-id="{{ e.id }}">
                  <button 
                      class="estado-btn estado-{{ e.estado_laboral|default:'trabajando' }}">
                      <span class="estado-text">
                          {% if e.estado_laboral == 'vacaciones' %}De vacaciones
                          {% elif e.estado_laboral == 'licencia' %}Licencia
                          {% elif e.estado_laboral == 'despedido' %}Despedido
                          {% else %}Trabajando{% endif %}
                      </span>
                      <span class="estado-caret">▾</span>
                  </button>

                  <div class="estado-menu">
                      <button type="button" class="estado-option" data-estado="trabajando">Trabajando</button>
                      <button type="button" class="estado-option" data-estado="vacaciones">De vacaciones</button>
                      <button type="button" class="estado-option" data-estado="licencia">Licencia</button>
                      <button type="button" class="estado-option" data-estado="despedido">Despedido</button>
                  </div>
              </div>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No hay empleados registrados</td></tr>
        {% endfor %}
    </tbody>
</table>


<!--Agregar empleado con formulario-->
<div id="employeeModal" class="modal hidden">
  <div class="modal-content form-card">
    <h3 class="modal-title">Agregar nuevo empleado</h3>

    <form id="employeeForm" method="post" action="{% url 'crear_empleado' %}">
      {% csrf_token %}

      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" name="nombre" class="input-field" required>
      </div>

      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="username" class="input-field" required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" class="input-field" required>
      </div>

      <div class="form-group">
        <label>Rol</label>
        <select name="rol" class="input-field" required>
          <option value="Mesero">Mesero</option>
          <option value="Cocinero">Cocinero</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="closeModal">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>

    </form>
  </div>
</div>
