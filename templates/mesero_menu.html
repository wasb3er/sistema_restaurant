{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesero – RestFreshCO</title>
    <link rel="stylesheet" href="{% static 'mesero_style.css' %}">
</head>

<body>

<header class="topbar">
    <h1 class="title">Mesero</h1>

    <div class="topbar-right">
        <div class="chip">Garzón: <strong>{{ request.session.empleado_nombre }}</strong></div>
        <a href="{% url 'logout_por_rol' 'mesero' %}" class="btn-logout">Cerrar sesión</a>
    </div>
</header>

<div class="mesero-layout">

    <!-- ===== MESAS ===== -->
    <section>
        <div class="controls">
            <input id="search" type="search" class="search-box" placeholder="Buscar mesa...">

            <select id="filter" class="filter-select">
                <option value="all">Todas</option>
                <option value="libre">Libres</option>
                <option value="pedido">Con pedido</option>
                <option value="listo">Listas</option>
                <option value="entregado">Entregadas</option>
            </select>
        </div>

        <div id="mesasGrid" class="mesas-grid"></div>
    </section>

    <!-- ===== PANEL ===== -->
    <aside class="panel">

        <h2 id="panelTitle">Selecciona una mesa</h2>

        <div id="orderItems" class="order-items">
            <p class="empty-msg">Aquí aparecerán los ítems del pedido.</p>
        </div>

        <div class="totals">
            <span>Total:</span>
            <span id="totalAmount">$0</span>
        </div>

        <div class="panel-actions">
            <button class="btn secondary oculto" id="sendKitchen">Enviar a cocina</button>
            <button class="btn secondary oculto" id="addItem">+ Agregar ítem</button>
            <button class="btn warn oculto" id="finishOrder">Acción</button>
        </div>

    </aside>

</div>

<!-- ===== MODAL PARA AGREGAR ÍTEM ===== -->
<div id="modalAddItem" class="modal oculto">
    <div class="modal-content">
        <button id="closeModalAddItem" class="close-btn">×</button>
        <h3>Agregar ítem</h3>
        <div id="modalItemsContainer"></div>
    </div>
</div>

<script src="{% static 'js/mesero_script.js' %}"></script>
</body>
</html>
