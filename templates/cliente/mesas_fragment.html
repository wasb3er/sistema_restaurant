{% csrf_token %}

<!-- ========== PRIMER PISO ========== -->
<div class="salon" id="primer-piso">

    <!-- MESA 1 -->
    <form method="post" action="" class="mesa" data-mesa-id="1" role="button">
        {% csrf_token %}
        <input type="hidden" name="vista" value="mesa">
        <input type="hidden" name="mesa_numero" value="1">
        <input type="hidden" name="nombre" value="{{ nombre }}">
        <input type="hidden" name="personas" value="{{ personas }}">

        <button type="submit" class="mesa-content">
            <div class="mesa-header"><span class="mesa-nombre">Mesa 1</span></div>
            <div class="mesa-body">
                <span class="status"></span>
                {% comment %} <span class="timer">00:00:00</span> {% endcomment %}
            </div>
        </button>
    </form>
